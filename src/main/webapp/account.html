<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RailSetu - Account Required</title>

    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Background image & overlay */
        .background-image {
            background-image: url('https://media.istockphoto.com/id/176957261/photo/railway-tracks.jpg?s=612x612&w=0&k=20&c=aJ6X4pFB24zzMueaE0MxWGRPVsRZxHfAvTTdQnXUWl8=');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            position: relative;
        }

        .background-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.3);
            z-index: -1;
        }

        body {
            z-index: 0;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 4px; }
        ::-webkit-scrollbar-track { background: #f0f0f0; }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-purple': '#6366f1',
                        'secondary-blue': '#4f46e5',
                        'button-blue': '#3b82f6', // Added from button class
                    },
                    fontFamily: {
                        'serif': ['"Times New Roman"', 'serif'],
                    }
                }
            }
        }
    </script>
</head>

<body class="background-image flex items-center justify-center min-h-screen p-4 font-serif">

    <!-- Centered Box -->
    <div class="bg-white rounded-lg shadow-lg w-full max-w-md p-10 text-center bg-opacity-95 backdrop-blur-sm">
        <h2 class="text-2xl font-bold text-gray-800 mb-3">Account Required</h2>

        <p class="text-gray-600 flex items-center justify-center mb-6">
            <span class="text-yellow-500 text-lg mr-2">⚠️</span> Please log in or sign up to continue.
        </p>

        <div class="flex flex-col sm:flex-row justify-center gap-4">
            
            <button onclick="location.href='login.jsp'" class="bg-button-blue text-white px-6 py-2 rounded-md hover:bg-secondary-blue transition duration-200">
                Login
            </button>
            
            <button onclick="location.href='signup.jsp'" class="bg-button-blue text-white px-6 py-2 rounded-md hover:bg-secondary-blue transition duration-200">
                Sign Up
            </button>
        </div>
    </div>

</body>
</html>
